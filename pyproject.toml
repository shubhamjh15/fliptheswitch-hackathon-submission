[project]
name = "snitch"
version = "1.0.0"
description = "SNITCH - an incident war-room on Switch where AI agents rat out the deploy that broke prod."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
snitch = "snitch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["snitch*"]

[tool.setuptools.package-data]
snitch = ["templates/*.yaml", "static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
